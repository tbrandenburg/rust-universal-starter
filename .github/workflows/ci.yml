name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TRUNK_VERSION: "0.21.14"
  TAURI_CLI_VERSION: "2.12.6"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core-web-and-terminal:
    name: Core, web and terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain and Trunk
        run: |
          rustup show
          tool_bin="$RUNNER_TEMP/rust-starter-bin"
          mkdir -p "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$tool_bin" trunk
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test and lint the shared core
        run: |
          cargo test --locked -p app-core
          cargo check --locked -p app-core --target wasm32-unknown-unknown
          cargo clippy --locked -p app-core --all-targets -- -D warnings
      - name: Check and lint the terminal app
        run: |
          cargo check --locked --manifest-path tui/Cargo.toml
          cargo clippy --locked --manifest-path tui/Cargo.toml --all-targets -- -D warnings
      - name: Lint and build the browser app
        run: |
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
          trunk build --release
      - name: Upload the browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
    env:
      TOOL_TARGET: ${{ matrix.target }}
      BUNDLE_FORMAT: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install toolchain
        run: rustup show
      - name: Install Trunk and Tauri CLI on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tool_bin="$RUNNER_TEMP/rust-starter-bin"
          mkdir -p "$tool_bin"
          echo "$tool_bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-${TOOL_TARGET}.tar.gz" | tar -xz -C "$tool_bin" trunk
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            curl -fsSL --retry 3 "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-${TOOL_TARGET}.tgz" | tar -xz -C "$tool_bin" cargo-tauri
          else
            archive="$RUNNER_TEMP/cargo-tauri.zip"
            curl -fsSL --retry 3 "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-${TOOL_TARGET}.zip" -o "$archive"
            unzip -o "$archive" cargo-tauri -d "$tool_bin"
          fi
      - name: Install Trunk and Tauri CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE '.cargo/bin'
          $trunk = Join-Path $env:RUNNER_TEMP 'trunk.zip'
          $tauri = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest "https://github.com/trunk-rs/trunk/releases/download/v$env:TRUNK_VERSION/trunk-$env:TOOL_TARGET.zip" -OutFile $trunk
          Invoke-WebRequest "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$env:TAURI_CLI_VERSION/cargo-tauri-$env:TOOL_TARGET.zip" -OutFile $tauri
          Expand-Archive $trunk -DestinationPath $cargoBin -Force
          Expand-Archive $tauri -DestinationPath $cargoBin -Force
      - name: Lint the desktop app
        if: runner.os == 'Linux'
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build the desktop package
        shell: bash
        run: cargo tauri build --ci --no-sign --bundles "$BUNDLE_FORMAT" -- --locked
      - name: Upload the desktop package
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: target/release/bundle/${{ matrix.bundle }}/
          if-no-files-found: error
